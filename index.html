<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#FDF8F2;color:#3D2B1F;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#FDF8F2;padding:14px 14px 10px;border-bottom:1px solid #EAD9C8}
h1{font-size:17px;font-weight:600;color:#7A4828;margin-bottom:10px}
.search-box{position:relative;margin-bottom:10px}
input{width:100%;background:#FFF8F0;border:1.5px solid #E2C9B0;border-radius:12px;padding:11px 16px 11px 40px;font-size:16px;color:#3D2B1F;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:#C07840;background:#FFFCF8}
input::placeholder{color:#B89880}
.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#C07840;font-size:17px;pointer-events:none}
.clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#B89880;font-size:18px;cursor:pointer;padding:0;line-height:1;display:none;width:auto}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:#FFF8F0;border:1.5px solid #E2C9B0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;color:#7A4828;cursor:pointer}
.fbtn.on{background:#C07840;border-color:#C07840;color:#FFF8F0}
.stats{padding:8px 14px 4px;font-size:12px;color:#B89880}
.grid{display:grid;grid-template-columns:1fr;gap:8px;padding:0 12px 60px}
.card{background:#FFFCF8;border:1px solid #EAD9C8;border-radius:12px;padding:10px 12px}
.card:active{background:#FFF3E6}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.names{flex:1;min-width:0}
.en{font-size:13px;font-weight:500;color:#3D2B1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{font-size:11px;color:#9C7A60;margin-top:1px}
.mult{font-size:16px;font-weight:600;color:#C07840;margin-left:6px;white-space:nowrap}
.card-bot{display:flex;flex-direction:column;gap:4px;margin-top:5px;min-width:0;overflow:hidden}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tl{background:#F5E6D0;color:#7A4828}
.tr{background:#FAD9B5;color:#854F0B}
.te{background:#F0EAD6;color:#6B5230}
.tn{background:#F5F0E8;color:#9C8570}
.stag{font-size:10px;padding:3px 7px;border-radius:8px;background:#F5F0E8;color:#7A6050;line-height:1.5;display:inline-block;max-width:100%;word-break:break-word;white-space:normal}
.stag-en{display:block;color:#B89880;font-size:9px;white-space:normal}
.empty{text-align:center;padding:50px 0;color:#B89880;font-size:14px;grid-column:1/-1}
</style>

</header>

["Chilled",2,"寒意",[["霜冻天气","Frost weather"],["北极熊/寿司熊/狸猫宠物","Polar Bear/Tanuki/Sushi Bear pet"],["寒意喷雾","Mutation Spray Chilled"]]],
["Choc",2,"巧克力",[["巧克力喷水器","Chocolate Sprinkler"],["巧克力雨天气","Chocolate Rain weather"],["Choc喷雾","Mutation Spray Choc"],["狸猫宠物","Tanuki pet"]]],
["Moonlit",2,"月光",[["夜晚自动触发(每2分钟最多6株)","Night event, max 6 plants/2min"],["夜杖道具","Night Staff"],["狸猫宠物","Tanuki pet"]]],
["Windstruck",2,"风袭",[["大风/狂风天气","Windy/Gale weather"],["翼龙宠物","Pterodactyl pet"],["风袭喷雾","Mutation Spray Windstruck"]]],
["Glimmering",2,"闪烁",[["仙女事件","Fairy event"],["漫游仙女","Roaming Fairies"],["Glimmering喷雾","Mutation Spray Glimmering"],["发光精灵宠物","Glimmering Sprite pet"]]],
["Snowy",2,"白雪",[]],
["Fiery",2,"火焰",[]]
];

const groups=[["全部",""],["A-E","ae"],["F-J","fj"],["K-O","ko"],["P-T","pt"],["U-Z","uz"]];
const ranges={ae:/^[a-e]/i,fj:/^[f-j]/i,ko:/^[k-o]/i,pt:/^[p-t]/i,uz:/^[u-z]/i};
let activeGroup="",searchVal="";

function tier(m){
  if(m>=200)return['tl','#C07840','传奇'];
  if(m>=100)return['tr','#D4956A','稀有'];
  if(m>=30)return['te','#C4A882','精英'];
  return['tn','#D8C8B8','普通'];
}

function render(){
  const el=document.getElementById('grid'),st=document.getElementById('stats');
  let list=[...data];
  if(searchVal)list=list.filter(([n,,cn,srcs])=>{
    const s=searchVal;
    return n.toLowerCase().includes(s)||cn.includes(s)||srcs.some(([c,e])=>c.includes(s)||e.toLowerCase().includes(s));
  });
  if(activeGroup&&ranges[activeGroup])list=list.filter(([n])=>ranges[activeGroup].test(n));
  if(activeGroup||searchVal)list.sort((a,b)=>a[0].localeCompare(b[0]));
  st.textContent=list.length===data.length?`全部 ${data.length} 种（倍率排序）`:`找到 ${list.length} 种（字母排序）`;
  if(!list.length){el.innerHTML='<div class="empty">没有找到匹配的变异</div>';return;}
  el.innerHTML=list.map(([n,m,cn,srcs])=>{
    const[tc,dc,lb]=tier(m);
    const tags=srcs.map(([c,e])=>`<span class="stag">${c}<span class="stag-en">${e}</span></span>`).join('');
    return`<div class="card"><div class="card-top"><div class="names"><div class="en">${n}</div><div class="cn">${cn}</div></div><div class="mult">${m}x</div></div>${tags?`<div class="card-bot">${tags}</div>`:''}` +'</div>';
  }).join('');
}

function clearSearch(){
  document.getElementById('q').value='';
  searchVal='';
  document.getElementById('clear-btn').style.display='none';
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  document.querySelector('.fbtn').classList.add('on');
  render();
}

const fr=document.getElementById('filters');
groups.forEach(([label,key])=>{
  const b=document.createElement('button');
  b.className='fbtn'+(key===''?' on':'');
  b.textContent=label;
  b.onclick=()=>{
    activeGroup=key;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('q').value='';
    searchVal='';
    document.getElementById('clear-btn').style.display='none';
    render();
  };
  fr.appendChild(b);
});

document.getElementById('q').addEventListener('input',function(){
  searchVal=this.value.trim().toLowerCase();
  document.getElementById('clear-btn').style.display=searchVal?'block':'none';
  if(searchVal){activeGroup='';document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));document.querySelector('.fbtn').classList.add('on');}
  render();
});

render();
</script>
